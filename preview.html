<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos 미리보기</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #f5f5f5;
      color: #555;
      font-weight: 600;
    }
    tbody tr:hover {
      background: #fafafa;
    }
    td.done {
      text-decoration: line-through;
      color: #888;
    }
    td.center {
      text-align: center;
    }
    #message {
      color: #c00;
    }
  </style>
</head>
<body>
  <h1>Todos 목록</h1>
  <p>
    <a href="index.html">홈으로</a>
  </p>
  <p id="message"></p>
  <table id="todo-table" hidden>
    <thead><tr id="todo-head"></tr></thead>
    <tbody id="todo-body"></tbody>
  </table>

  <script>
    const SUPABASE_URL = "https://hdanrcibqlhotjnefsgg.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_OFnr9fX_q0hrQHRQzWKJzA_X0dfb3RN";

    const TITLE_KEYS = ["title", "task", "name", "content", "text"];
    const DONE_KEYS = ["completed", "is_complete", "is_done", "done"];

    const pickKey = (todo, candidates) => candidates.find((key) => key in todo);

    async function loadTodos() {
      const table = document.getElementById("todo-table");
      const headEl = document.getElementById("todo-head");
      const bodyEl = document.getElementById("todo-body");
      const messageEl = document.getElementById("message");

      try {
        const res = await fetch(`${SUPABASE_URL}test_todos?select=*`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        });

        if (!res.ok) {
          throw new Error(`요청 실패: ${res.status} ${res.statusText}`);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          messageEl.textContent = "데이터가 없습니다.";
          return;
        }

        const titleKey = pickKey(todos[0], TITLE_KEYS);
        const doneKey = pickKey(todos[0], DONE_KEYS);
        const columns = Object.keys(todos[0]);

        headEl.innerHTML = columns
          .map((col) => `<th>${col}</th>`)
          .join("");

        bodyEl.innerHTML = todos
          .map((todo) => {
            const cells = columns
              .map((col) => {
                if (col === doneKey) {
                  return `<td class="center">${todo[col] ? "✅" : "⬜"}</td>`;
                }
                if (col === titleKey) {
                  const isDone = doneKey ? Boolean(todo[doneKey]) : false;
                  return `<td class="${isDone ? "done" : ""}">${todo[col]}</td>`;
                }
                return `<td>${todo[col]}</td>`;
              })
              .join("");
            return `<tr>${cells}</tr>`;
          })
          .join("");

        table.hidden = false;
      } catch (err) {
        messageEl.textContent = `데이터를 불러오지 못했습니다: ${err.message}`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
