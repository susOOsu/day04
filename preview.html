<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos 미리보기</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fff;
    }
    .todo-check {
      font-size: 18px;
      line-height: 1.4;
    }
    .todo-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .todo-title {
      font-size: 15px;
    }
    .todo-title.done {
      text-decoration: line-through;
      color: #888;
    }
    .todo-meta {
      font-size: 12px;
      color: #888;
    }
    #message {
      color: #c00;
    }
  </style>
</head>
<body>
  <h1>Todos 목록</h1>
  <p>
    <a href="index.html">홈으로</a>
  </p>
  <p id="message"></p>
  <ul id="todo-list"></ul>

  <script>
    const SUPABASE_URL = "https://hdanrcibqlhotjnefsgg.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_OFnr9fX_q0hrQHRQzWKJzA_X0dfb3RN";

    async function loadTodos() {
      const listEl = document.getElementById("todo-list");
      const messageEl = document.getElementById("message");

      try {
        const res = await fetch(`${SUPABASE_URL}test_todos?select=*`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        });

        if (!res.ok) {
          throw new Error(`요청 실패: ${res.status} ${res.statusText}`);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          messageEl.textContent = "데이터가 없습니다.";
          return;
        }

        const TITLE_KEYS = ["title", "task", "name", "content", "text"];
        const DONE_KEYS = ["completed", "is_complete", "is_done", "done"];

        const pickKey = (todo, candidates) =>
          candidates.find((key) => key in todo);

        listEl.innerHTML = todos
          .map((todo) => {
            const titleKey = pickKey(todo, TITLE_KEYS);
            const doneKey = pickKey(todo, DONE_KEYS);

            const title = titleKey ? todo[titleKey] : "(제목 없음)";
            const isDone = doneKey ? Boolean(todo[doneKey]) : false;

            const metaEntries = Object.entries(todo).filter(
              ([key]) => key !== titleKey && key !== doneKey
            );
            const meta = metaEntries
              .map(([key, value]) => `${key}: ${value}`)
              .join(" · ");

            return `
              <li>
                <span class="todo-check">${isDone ? "✅" : "⬜"}</span>
                <span class="todo-body">
                  <span class="todo-title${isDone ? " done" : ""}">${title}</span>
                  ${meta ? `<span class="todo-meta">${meta}</span>` : ""}
                </span>
              </li>
            `;
          })
          .join("");
      } catch (err) {
        messageEl.textContent = `데이터를 불러오지 못했습니다: ${err.message}`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
